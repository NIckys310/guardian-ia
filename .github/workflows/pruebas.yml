# Revisa Guardián en cada cambio: sintaxis de todo el JavaScript y pruebas automáticas.
name: Pruebas de Guardián

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardian-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guardian-web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar sintaxis
        run: npm run test:sintaxis
      - name: Pruebas automáticas
        run: npm test
