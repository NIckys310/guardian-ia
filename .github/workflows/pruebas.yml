# Revisa Guardián en cada cambio: sintaxis de todo el JavaScript y pruebas automáticas.
name: Pruebas de Guardián

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardian-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guardian-web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar sintaxis
        run: npm run test:sintaxis
      - name: Pruebas automáticas
        run: npm test
      - name: Navegador para las pruebas de interfaz
        run: npx playwright install --with-deps chromium
      - name: Pruebas de interfaz (PC y celular)
        run: npm run test:e2e
      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-de-interfaz
          path: guardian-web/test-results/
          if-no-files-found: ignore
